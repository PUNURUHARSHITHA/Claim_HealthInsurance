<div class="review-container" *ngIf="isAdmin">
  <h2>Mark Claim as Under Review</h2>

  <div class="form-group">
    <label for="claimID">Claim ID:</label>
    <input type="number" id="claimID" [(ngModel)]="claimID" placeholder="Enter Claim ID" />
  </div>

  <div class="button-group">
    <button (click)="submit()">Update Status</button>
    <button class="show-button" (click)="toggleSubmittedClaims()">Show Submitted Claims</button>
  </div>

  <div *ngIf="message" class="success-message">{{ message }}</div>
  <div *ngIf="error" class="error-message">{{ error }}</div>

  <div *ngIf="showSubmitted && submittedClaims.length > 0" class="submitted-table">
    <h3>Submitted Claims</h3>
    <table>
      <thead>
        <tr>
          <th>Claim ID</th>
          <th>Treatment</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let claim of submittedClaims">
          <td>{{ claim.claimID }}</td>
          <td>{{ claim.treatmentDetails }}</td>
          <td>{{ claim.status }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="showSubmitted && submittedClaims.length === 0 && !error" class="info-message">
    No submitted claims found.
  </div>
</div>

<div *ngIf="!isAdmin" class="error-message">
  You do not have permission to update claim status.
</div>
