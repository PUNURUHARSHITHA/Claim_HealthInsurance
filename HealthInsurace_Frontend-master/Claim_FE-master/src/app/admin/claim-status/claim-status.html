<div class="status-container" *ngIf="isAdmin">
  <h2>Approve Claim</h2>

  <div class="form-group">
    <label for="claimID">Claim ID:</label>
    <input type="number" id="claimID" [(ngModel)]="claimID" placeholder="Enter Claim ID" />
  </div>

  <button (click)="approve()">Approve Claim</button>

  <div *ngIf="message" class="success-message">{{ message }}</div>
  <div *ngIf="error" class="error-message">{{ error }}</div>
</div>

<div *ngIf="!isAdmin" class="error-message">
  You do not have permission to approve claims.
</div>
